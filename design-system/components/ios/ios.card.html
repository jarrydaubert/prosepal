          <div className="pp-screen-body" style={{ padding: "4px 20px 16px", display: "flex", flexDirection: "column", gap: 14 }}>
            <Card pad="lg" interactive style={{ display: "flex", alignItems: "center", gap: 14 }}>

              <div style={{ flex: 1 }}>

                <div style={{ font: "400 14px var(--font-ui)", color: "var(--text-tertiary)" }}>A message, note, or longer piece</div>
              </div>
              <span style={{ color: "var(--text-quaternary)", fontSize: 18 }}>{I("caret-right")}</span>
            </Card>
            <div className="pp-listgroup">

              <ListRow lead={I("heart")} title="Anniversary message" subtitle="Heartfelt · 3 days ago" chevron onClick={()=>{}} />
            </div>
          </div>
          <TabBar value={tab} onChange={setTab} items={tabs} />
          <HomeIndicator />
        </PhoneFrame>
      </div>

      <div className="right">
        <div>
          <div className="lab">NavBar · large title</div>
          <div className="spec"><NavBar large largeTitle="Library"
            trailing={<IconButton icon={I("plus")} label="New" />} /></div>
        </div>
        <div>
          <div className="lab">NavBar · inline + back</div>
