<!-- @dsCard group="Components" viewport="700x760" name="Writing surface" subtitle="Canvas · tones · draft · refine · generating" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  body { margin: 0; background: var(--bg-grouped); }
  .wrap { padding: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 18px; }
  .lab { font: 600 11px/1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const NS = window.ProsePalDesignSystem_019e02;
const { WritingCanvas, ToneSelector, DraftCard, RefineBar, GenerationState, IconButton, Button } = NS;
const { useState } = React;
const I = (n) => <i className={"ph ph-" + n} />;

function Demo() {
  const [text, setText] = useState("hey daniel, thanks for the invite but i cant make it sunday, maybe another time");
  const [tones, setTones] = useState(["warm", "concise"]);
  return (
    <>
      <div className="col">
        <div className="lab">WritingCanvas</div>
        <WritingCanvas
          value={text} onChange={setText} prompt="What do you want to say?" count="24 words"
          tools={<><IconButton icon={I("microphone")} label="Dictate" size="sm" /><IconButton icon={I("paperclip")} label="Attach" size="sm" /></>}
          actions={<Button size="md" icon={I("feather")}>Refine</Button>} />
        <div className="lab">ToneSelector</div>
        <ToneSelector value={tones} onChange={setTones} hint="Pick a few" options={[
          { id: "warm", label: "Warmer", icon: I("heart") },
          { id: "concise", label: "More concise", icon: I("scissors") },
          { id: "confident", label: "Confident", icon: I("flag-banner") },
          { id: "formal", label: "More formal", icon: I("briefcase") },
          { id: "playful", label: "Playful", icon: I("smiley") },
        ]} />
        <div className="lab">GenerationState</div>
        <div style={{ background: "var(--surface)", borderRadius: "var(--radius-card)", border: "0.5px solid var(--separator)" }}>
          <GenerationState label="Keeping your voice…" lines={3} />
        </div>
      </div>

      <div className="col">
        <div className="lab">DraftCard</div>
        <DraftCard tones={["Warmer", "Concise"]} voiceNote="Your voice, kept"
          variants={{ current: 2, total: 3 }}
          actions={<>
            <button className="pp-draftbtn">{I("copy")} Copy</button>
            <button className="pp-draftbtn">{I("arrow-clockwise")} Try again</button>
            <span className="pp-spacer" />
            <button className="pp-draftbtn pp-draftbtn--accent">{I("check")} Use this</button>
          </>}>
          <p>Hi Daniel — thank you so much for the invitation. I won't be able to make it on Sunday, but I'd genuinely love to find another time soon.</p>
        </DraftCard>
        <div className="lab">RefineBar</div>
        <RefineBar onAction={()=>{}} actions={[
          { id: "warmer", label: "Warmer", icon: I("heart") },
          { id: "shorter", label: "Shorter", icon: I("scissors") },
          { id: "sharper", label: "Sharper", icon: I("sparkle") },
          { id: "simpler", label: "Simpler", icon: I("waveform") },
        ]} />
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
