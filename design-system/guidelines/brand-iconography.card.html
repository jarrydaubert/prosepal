<!-- @dsCard group="Brand" viewport="700x220" name="Iconography · Phosphor" subtitle="SF Symbols in production; Phosphor (regular) is the web stand-in" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 20px 24px; font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px 8px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .ic i { font-size: 26px; color: var(--text); }
  .ic span { font: 500 10px/1 var(--font-mono); color: var(--text-tertiary); }
  .note { margin-top: 16px; font-size: 13px; color: var(--text-tertiary); display: flex; align-items: center; gap: 8px; }
  .note b { color: var(--text-secondary); font-weight: 600; }
</style></head>
<body>
  <div class="grid">
    <div class="ic"><i class="ph ph-feather"></i><span>feather</span></div>
    <div class="ic"><i class="ph ph-magic-wand"></i><span>refine</span></div>
    <div class="ic"><i class="ph ph-heart"></i><span>warmer</span></div>
    <div class="ic"><i class="ph ph-scissors"></i><span>shorter</span></div>
    <div class="ic"><i class="ph ph-sparkle"></i><span>sharper</span></div>
    <div class="ic"><i class="ph ph-seal-check"></i><span>kept</span></div>
    <div class="ic"><i class="ph ph-lock-simple"></i><span>private</span></div>
    <div class="ic"><i class="ph ph-microphone"></i><span>dictate</span></div>
    <div class="ic"><i class="ph ph-cards"></i><span>drafts</span></div>
    <div class="ic"><i class="ph ph-bookmarks-simple"></i><span>library</span></div>
    <div class="ic"><i class="ph ph-arrow-clockwise"></i><span>again</span></div>
    <div class="ic"><i class="ph ph-copy"></i><span>copy</span></div>
    <div class="ic"><i class="ph ph-sliders-horizontal"></i><span>tune</span></div>
    <div class="ic"><i class="ph ph-paper-plane-tilt"></i><span>send</span></div>
    <div class="ic"><i class="ph ph-user-focus"></i><span>voice</span></div>
    <div class="ic"><i class="ph ph-arrow-circle-up"></i><span>higher limits</span></div>
  </div>
  <div class="note"><b>Regular weight · 1.5px stroke · rounded terminals.</b> Fill weight only for the active tab &amp; status glyphs.</div>
</body></html>
