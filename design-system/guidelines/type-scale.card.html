<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 20px 26px; font-family: var(--font-ui); }
  .row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; gap: 2px; }
  .glyph { color: var(--text); font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .n { font: 500 10px/1 var(--font-mono); color: var(--text-tertiary); }
</style></head>
<body>
  <div class="row">
    <div class="item"><span class="glyph" style="font-size:11px">Aa</span><span class="n">11</span></div>
    <div class="item"><span class="glyph" style="font-size:12px">Aa</span><span class="n">12</span></div>
    <div class="item"><span class="glyph" style="font-size:13px">Aa</span><span class="n">13</span></div>
    <div class="item"><span class="glyph" style="font-size:15px">Aa</span><span class="n">15</span></div>
    <div class="item"><span class="glyph" style="font-size:17px">Aa</span><span class="n">17 ·body</span></div>
    <div class="item"><span class="glyph" style="font-size:20px">Aa</span><span class="n">20</span></div>
    <div class="item"><span class="glyph" style="font-size:22px">Aa</span><span class="n">22</span></div>
    <div class="item"><span class="glyph" style="font-size:28px">Aa</span><span class="n">28</span></div>
    <div class="item"><span class="glyph" style="font-size:34px">Aa</span><span class="n">34</span></div>
    <div class="item"><span class="glyph" style="font-size:52px">Aa</span><span class="n">52 ·display</span></div>
  </div>
</body></html>
