<!-- @dsCard group="Type" viewport="700x150" name="Mono · metadata" subtitle="Geist Mono for counts, timings, and quiet technical detail" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500&family=Geist+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 20px 26px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; }
  .m { font-family: var(--font-mono); color: var(--text-secondary); font-feature-settings: "tnum"; }
  .big { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; color: var(--text); }
  .mid { font-size: 14px; }
  .kbd { display: inline-flex; align-items: center; gap: 6px; }
  .key { font-family: var(--font-mono); font-size: 12px; background: var(--fill-strong); color: var(--text-secondary); border-radius: 6px; padding: 3px 7px; box-shadow: var(--shadow-xs); }
  .lab { font: 500 11px/1 var(--font-ui); color: var(--text-quaternary); width: 100%; letter-spacing: .06em; text-transform: uppercase; }
</style></head>
<body>
  <span class="lab">Geist Mono · tabular figures · --font-mono</span>
  <span class="m big">24 words</span>
  <span class="m big">2 refines</span>
  <span class="m big">11:24</span>
  <span class="m mid">resets · Mon 9:00</span>
  <span class="m mid">7 / 10 left</span>
  <span class="kbd"><span class="key">⌘</span><span class="key">↵</span> <span class="m mid">to refine</span></span>
</body></html>
