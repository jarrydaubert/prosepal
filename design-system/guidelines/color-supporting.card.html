<!-- @dsCard group="Colors" viewport="700x150" name="Ink-blue & Sage · supporting" subtitle="Ink-blue carries trust & links; sage marks 'your voice, kept'" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 16px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .grp { display: flex; flex-direction: column; gap: 7px; }
  .lab { font: 600 10px/1 var(--font-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--text-quaternary); }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .chip { height: 46px; border-radius: 10px; box-shadow: inset 0 0 0 0.5px oklch(0 0 0 / 0.06); }
  .n { font: 500 10px/1 var(--font-mono); color: var(--text-tertiary); margin-top: 4px; display: block; }
</style></head>
<body>
  <div class="grp"><span class="lab">Ink-blue · trust / links</span>
    <div class="ramp">
      <div><div class="chip" style="background:var(--inkblue-100)"></div><span class="n">100</span></div>
      <div><div class="chip" style="background:var(--inkblue-200)"></div><span class="n">200</span></div>
      <div><div class="chip" style="background:var(--inkblue-300)"></div><span class="n">300</span></div>
      <div><div class="chip" style="background:var(--inkblue-400)"></div><span class="n">400</span></div>
      <div><div class="chip" style="background:var(--inkblue-500)"></div><span class="n">500</span></div>
      <div><div class="chip" style="background:var(--inkblue-600)"></div><span class="n">600</span></div>
      <div><div class="chip" style="background:var(--inkblue-700)"></div><span class="n">700</span></div>
    </div>
  </div>
  <div class="grp"><span class="lab">Sage · voice / success</span>
    <div class="ramp">
      <div><div class="chip" style="background:var(--sage-100)"></div><span class="n">100</span></div>
      <div><div class="chip" style="background:var(--sage-200)"></div><span class="n">200</span></div>
      <div><div class="chip" style="background:var(--sage-300)"></div><span class="n">300</span></div>
      <div><div class="chip" style="background:var(--sage-400)"></div><span class="n">400</span></div>
      <div><div class="chip" style="background:var(--sage-500)"></div><span class="n">500</span></div>
      <div><div class="chip" style="background:var(--sage-600)"></div><span class="n">600</span></div>
      <div><div class="chip" style="background:var(--sage-700)"></div><span class="n">700</span></div>
    </div>
  </div>
</body></html>
