<!-- @dsCard group="Type" viewport="700x300" name="Interface · Geist" subtitle="The native UI voice — SF Pro substitute, iOS type ramp" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 18px 26px; font-family: var(--font-ui); color: var(--text); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 0.5px solid var(--separator); }
  .line:last-child { border-bottom: none; }
  .tag { font: 500 11px/1 var(--font-mono); color: var(--text-tertiary); width: 150px; flex: none; }
  .lt { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .t1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }
  .hl { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .bd { font-size: 17px; font-weight: 400; }
  .sh { font-size: 15px; font-weight: 400; color: var(--text-secondary); }
  .cp { font-size: 12px; font-weight: 500; color: var(--text-tertiary); }
</style></head>
<body>
  <div class="line"><span class="tag">largetitle · 34/700</span><span class="lt">Drafts</span></div>
  <div class="line"><span class="tag">title2 · 22/600</span><span class="t1">How should it feel?</span></div>
  <div class="line"><span class="tag">headline · 17/600</span><span class="hl">Use this draft</span></div>
  <div class="line"><span class="tag">body · 17/400</span><span class="bd">Write the rough version first.</span></div>
  <div class="line"><span class="tag">subhead · 15/400</span><span class="sh">Warmer · More concise · Confident</span></div>
  <div class="line"><span class="tag">caption · 12/500</span><span class="cp">YOUR VOICE, KEPT</span></div>
</body></html>
