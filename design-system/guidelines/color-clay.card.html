<!-- @dsCard group="Colors" viewport="700x150" name="Clay · signature accent" subtitle="The brand tint — a refined terracotta-rose, never generic-blue" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); padding: 18px 20px; }
  .ramp { display: grid; grid-template-columns: repeat(10, 1fr); gap: 7px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 64px; border-radius: 12px; box-shadow: inset 0 0 0 0.5px oklch(0 0 0 / 0.06); }
  .n { font: 600 11px/1 var(--font-mono); color: var(--text-tertiary); }
  .v { font: 500 12px/1 var(--font-ui); color: var(--text-secondary); }
  .star { color: var(--accent-text); }
</style></head>
<body>
  <div class="ramp">
    <div class="sw"><div class="chip" style="background:var(--clay-50)"></div><span class="n">50</span></div>
    <div class="sw"><div class="chip" style="background:var(--clay-100)"></div><span class="n">100</span></div>
    <div class="sw"><div class="chip" style="background:var(--clay-200)"></div><span class="n">200</span></div>
    <div class="sw"><div class="chip" style="background:var(--clay-300)"></div><span class="n">300</span></div>
    <div class="sw"><div class="chip" style="background:var(--clay-400)"></div><span class="n">400</span></div>
    <div class="sw"><div class="chip" style="background:var(--clay-500)"></div><span class="n star">500 ★</span></div>
    <div class="sw"><div class="chip" style="background:var(--clay-600)"></div><span class="n">600</span></div>
    <div class="sw"><div class="chip" style="background:var(--clay-700)"></div><span class="n">700</span></div>
    <div class="sw"><div class="chip" style="background:var(--clay-800)"></div><span class="n">800</span></div>
    <div class="sw"><div class="chip" style="background:var(--clay-900)"></div><span class="n">900</span></div>
  </div>
</body></html>
