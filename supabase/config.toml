# Supabase Edge Functions Configuration
# https://supabase.com/docs/guides/functions/config

# Disable platform-level JWT verification for functions that handle auth internally.
# These functions verify users via auth.getUser() with the passed Bearer token,
# making the platform check redundant.

[functions.delete-user]
verify_jwt = false

[functions.exchange-apple-token]
verify_jwt = false

[functions.send-feedback]
verify_jwt = false

[functions.generate-card]
# Gateway validates Supabase auth internally and can be run in explicit
# anonymous dev mode with GATEWAY_DEV_ALLOW_ANONYMOUS=true.
verify_jwt = false

[functions.revenuecat-webhook]
# RevenueCat sends its own shared-secret Authorization header, not a Supabase JWT.
# The function validates REVENUECAT_WEBHOOK_SECRET internally.
verify_jwt = false
